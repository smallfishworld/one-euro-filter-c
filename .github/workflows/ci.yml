name: C CI
on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --config Debug --parallel
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASan and UBSan
        run: cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug -DOEF_ENABLE_SANITIZERS=ON -DCMAKE_C_FLAGS="-Wall -Wextra -Wpedantic -Werror"
      - name: Build
        run: cmake --build build-sanitize --parallel
      - name: Run instrumented tests
        run: ctest --test-dir build-sanitize --output-on-failure
